name: 🛠️ Build Niagara

on:
    push:
        branches: [ master ]
        tags: [ 'v*' ]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    checks: write
    pull-requests: write

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    native:
        name: 🔨 Native Build and Test (${{ matrix.platform }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                java: [
                    22,
                ]

                include:
                    - platform: windows-x64
                      os: windows-2025-vs2026
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Setup JDK ${{ matrix.java }}
              uses: actions/setup-java@v6
              with:
                  distribution: zulu
                  java-version: ${{ matrix.java }}

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Fetch Ultralight SDK
              id: sdk
              uses: ./.github/actions/fetch-ultralight-sdk
              with:
                  platform: ${{ matrix.platform }}

            - name: Build JNI Bridge Library
              shell: bash
              env:
                  SDK_PATH: ${{ steps.sdk.outputs.path }}
              run: ./gradlew :niagara-jni:stageJNIBridgeLibrary -Pplatform=${{ matrix.platform }} -Pultralight_sdk_location="$SDK_PATH"

            - name: Run Unit Tests
              shell: bash
              env:
                  SDK_PATH: ${{ steps.sdk.outputs.path }}
              run: ./gradlew test -Pplatform=${{ matrix.platform }} -Pultralight_sdk_location="$SDK_PATH"

            - name: Publish Unit Test Results
              uses: mikepenz/action-junit-report@v6
              if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
              with:
                  report_paths: '**/build/test-results/test/TEST-*.xml'
                  check_name: ✅ Unit Test Results (${{ matrix.platform }})

            - name: Upload JNI Bridge Library
              uses: actions/upload-artifact@v7
              with:
                  name: niagara-natives-${{ matrix.platform }}
                  path: niagara-jni/build/generated/niagara-natives/natives
                  if-no-files-found: error

    build:
        name: 📦 Build Niagara
        needs: native
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                java: [
                    22,
                ]

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Setup JDK ${{ matrix.java }}
              uses: actions/setup-java@v6
              with:
                  distribution: zulu
                  java-version: ${{ matrix.java }}

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Download Prebuilt JNI Bridge Libraries
              uses: actions/download-artifact@v8
              with:
                  pattern: niagara-natives-*
                  merge-multiple: true
                  path: prebuilt-natives

            - name: Make Gradle Wrapper Executable
              run: chmod +x ./gradlew

            - name: Build Niagara
              run: ./gradlew build -x test -Pniagara_prebuilt_natives=prebuilt-natives
